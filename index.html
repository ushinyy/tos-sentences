<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>토스 만능문장 모음집 암기</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#171923;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--primary-dark:#1d4ed8;--soft:#eff6ff;--remember:#f59e0b;--danger:#dc2626;--success:#15803d;--success-soft:#f0fdf4;--danger-soft:#fef2f2;--purple:#7c3aed;--purple-soft:#f5f3ff;--shadow:0 18px 45px rgba(17,24,39,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#eef4ff 0,var(--bg) 280px)}button,input{font:inherit}.app{width:min(960px,calc(100% - 28px));margin:0 auto;padding:28px 0 56px}
header{margin-bottom:16px}.title-line{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.title-wrap h1{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.04em}.title-wrap p{margin:7px 0 0;color:var(--muted);font-size:14px}.saved-open{border:1px solid #fed7aa;background:#fff7ed;color:#b45309;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer;white-space:nowrap}
.top-tabs{display:flex;gap:7px;flex-wrap:wrap;background:#fff;padding:7px;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(17,24,39,.04)}.top-tab{flex:1;min-width:92px;border:0;background:transparent;padding:10px 12px;border-radius:11px;cursor:pointer;color:#4b5563;font-weight:900}.top-tab.active{background:var(--text);color:#fff}
.panel{display:none}.panel.active{display:block}.quiz-settings{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 7px 20px rgba(17,24,39,.035);display:grid;gap:11px}.setting-row{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}.setting-label{color:var(--muted);font-size:12px;font-weight:900;white-space:nowrap;min-width:66px;padding-top:9px}.filter-buttons{display:flex;gap:6px;flex-wrap:wrap;flex:1}.filter-btn{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:10px;min-height:36px;padding:7px 10px;font-weight:850;cursor:pointer}.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.utility-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:2px;border-top:1px solid #f1f2f4}.memory-only{display:flex;align-items:center;gap:8px;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:13px;font-weight:850;color:#374151;user-select:none}.memory-only input{width:17px;height:17px;accent-color:var(--remember)}.shuffle-btn{border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;border-radius:11px;min-height:38px;padding:7px 11px;font-weight:900;cursor:pointer}.pool-info{margin-left:auto;color:var(--muted);font-size:12px;font-weight:800;text-align:right}.progress-chip{display:inline-flex;align-items:center;gap:5px;background:#f3f4f6;color:#374151;border-radius:999px;padding:6px 10px;margin-left:6px;font-weight:900}.progress-chip strong{color:var(--primary)}
.card{background:var(--card);border:1px solid rgba(229,231,235,.9);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.card-top{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;border-radius:999px;background:#f3f4f6;color:#4b5563;font-size:13px;font-weight:800}.badge.part{background:var(--soft);color:var(--primary)}.badge.category{background:var(--purple-soft);color:var(--purple)}.badge.number{background:#f0fdfa;color:#0f766e}.saved-indicator{color:var(--remember);font-size:13px;font-weight:800}
.prompt{padding:34px 24px 22px}.label{color:var(--muted);font-size:13px;font-weight:800;margin-bottom:10px;letter-spacing:.02em}.translation{font-size:clamp(22px,4.5vw,30px);line-height:1.5;font-weight:800;letter-spacing:-.025em;min-height:78px;display:flex;align-items:center}.answer-box{margin-top:28px;border-radius:18px;border:1px dashed #cbd5e1;background:#fafafa;min-height:112px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center}.answer-placeholder{color:#a1a1aa;font-weight:700}.answer{display:none;font-size:clamp(19px,4vw,25px);line-height:1.5;font-weight:800;color:#111827}.answer.show{display:block}
.actions{padding:0 24px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:14px;min-height:52px;padding:12px 14px;cursor:pointer;font-weight:900;transition:transform .08s ease,background .15s ease}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:default;transform:none}.prev-btn{background:#f3f4f6;color:#374151;border:1px solid var(--line)}.prev-btn:hover:not(:disabled){background:#e5e7eb}.answer-btn{background:var(--text);color:#fff}.remember-btn{background:#fff7ed;color:#b45309;border:1px solid #fed7aa}.remember-btn.active{background:#f59e0b;color:#fff;border-color:#f59e0b}.next-btn{background:var(--primary);color:#fff}.next-btn:hover:not(:disabled){background:var(--primary-dark)}
.status-box{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;padding:46px 20px;text-align:center;color:var(--muted);box-shadow:0 7px 20px rgba(17,24,39,.03)}.status-box strong{display:block;color:#374151;margin-bottom:8px;font-size:17px}.status-box .mini-next{margin-top:15px;border:0;border-radius:12px;background:var(--primary);color:#fff;padding:10px 16px;font-weight:900;cursor:pointer}.tip{margin:13px 3px 0;color:var(--muted);font-size:12px;text-align:center}
.saved-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 2px 14px}.saved-head h2{margin:0;font-size:22px}.saved-head p{margin:6px 0 0;color:var(--muted);font-size:14px}.saved-head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.back-btn{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:850;cursor:pointer}.clear-btn{border:1px solid #fecaca;background:#fff;color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;cursor:pointer}.saved-list{display:grid;gap:12px}.saved-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 20px rgba(17,24,39,.04)}.saved-meta{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:12px}.saved-category{color:var(--primary);font-weight:900;font-size:13px}.saved-stats{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.remove-btn{border:0;background:#f3f4f6;color:#6b7280;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12px;font-weight:800}.saved-ko{font-size:17px;line-height:1.55;font-weight:800}.saved-en{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1f3;font-size:16px;line-height:1.55;color:#374151;font-weight:700}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;padding:48px 18px;text-align:center;color:var(--muted)}.footer-note{margin-top:18px;text-align:center;color:#9ca3af;font-size:12px}
@media(max-width:700px){.app{width:min(100% - 20px,960px);padding-top:18px}.title-line{align-items:flex-start;flex-direction:column}.saved-open{width:100%}.top-tabs{flex-wrap:nowrap;overflow-x:auto}.top-tab{flex:0 0 auto;min-width:88px}.setting-label{width:100%;padding-top:0}.utility-row{align-items:stretch}.pool-info{width:100%;margin-left:0;text-align:left}.card-top,.prompt,.actions{padding-left:18px;padding-right:18px}.actions{grid-template-columns:1fr 1fr}.saved-head{align-items:flex-start;flex-direction:column}.saved-head-actions{width:100%}.saved-head-actions button{flex:1}}

.mode-switch{display:inline-flex;gap:6px;margin:0 0 12px;padding:5px;background:#e9eef8;border:1px solid #dce3ef;border-radius:14px}.mode-btn{border:0;background:transparent;color:#64748b;border-radius:10px;padding:9px 15px;font-weight:900;cursor:pointer}.mode-btn.active{background:#fff;color:#111827;box-shadow:0 3px 10px rgba(15,23,42,.08)}
.study-settings{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 7px 20px rgba(17,24,39,.035)}.study-category-row{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}.study-intro{margin:0 2px 14px;color:var(--muted);font-size:13px;line-height:1.65}.study-content{display:grid;gap:16px}.study-category-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.study-category-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:15px;border-bottom:1px solid #eef0f3}.study-category-head h2{margin:0;font-size:clamp(20px,4vw,26px);letter-spacing:-.03em}.study-category-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.study-part-chip{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:11px;font-weight:900}.study-count-chip{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f3f4f6;color:#6b7280;font-size:11px;font-weight:900}.choice-block{padding:20px 0 3px}.choice-block+.choice-block{border-top:1px dashed #d9dde5}.choice-title{margin:0 0 12px;font-size:17px;line-height:1.45;color:#312e81;letter-spacing:-.02em}.study-list{margin:0;padding-left:22px;display:grid;gap:13px}.study-list li{padding-left:3px}.study-en{font-size:16px;line-height:1.55;font-weight:800;color:#1f2937}.study-ko{margin-top:4px;font-size:13px;line-height:1.55;color:#7c8492}.study-empty{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;padding:46px 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){.mode-switch{width:100%;display:flex}.mode-btn{flex:1}.study-category-card{padding:18px}.study-category-head{flex-direction:column}.study-category-meta{justify-content:flex-start}.study-category-row .setting-label{width:100%}}


.study-part-section{display:grid;gap:16px}.study-part-section+.study-part-section{margin-top:12px}.study-part-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px 0}.study-part-heading h2{margin:0;font-size:23px;letter-spacing:-.03em}.study-part-heading span{font-size:12px;font-weight:900;color:var(--muted);background:#eef2ff;border-radius:999px;padding:6px 10px}.study-title-wrap{min-width:0}.study-group-desc{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.6;font-weight:600}.broad-study-list{padding-top:18px}.broad-study-list li+li{margin-top:3px}
.study-sentence-row{display:flex;align-items:flex-start;gap:10px}.study-sentence-text{flex:1;min-width:0;overflow-wrap:anywhere}.study-remember-btn{flex:none;border:1px solid #e5e7eb;background:#fafafa;color:#6b7280;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;line-height:1.5;cursor:pointer;white-space:nowrap}.study-remember-btn.active{border-color:#fed7aa;background:#fff7ed;color:#b45309}.study-remember-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}@media(max-width:700px){.study-sentence-row{flex-wrap:wrap;gap:6px}.study-sentence-text{flex-basis:100%}.study-remember-btn{margin-bottom:3px}}
#numberBadge{display:none}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title-line">
    <div class="title-wrap"><h1>토스 만능문장 모음집</h1><p id="modeSubtitle">해석을 보고 영어 문장을 떠올려 보세요. 총 <strong id="totalCount"></strong>문장</p></div>
    <button id="savedOpenBtn" class="saved-open">★ 기억한 문장 <span id="savedCountTop">0</span></button>
  </div>
  <div class="mode-switch" aria-label="학습 모드 선택"><button id="memoryModeBtn" class="mode-btn active">퀴즈 모드</button><button id="studyModeBtn" class="mode-btn">암기 모드</button></div>
  <nav id="partTabs" class="top-tabs" aria-label="Part 선택"></nav>
</header>
<section id="quizPanel" class="panel active">
  <div class="quiz-settings">
    <div id="categoryRow" class="setting-row">
      <span class="setting-label">카테고리</span>
      <div id="categoryButtons" class="filter-buttons"></div>
    </div>
    <div class="utility-row">
      <label class="memory-only"><input id="memoryOnly" type="checkbox" />기억한 문장만 출제</label>
      <button id="shuffleBtn" class="shuffle-btn">↻ 문항 셔플</button>
      <div id="poolInfo" class="pool-info"></div>
    </div>
  </div>
  <div id="quizCard" class="card">
    <div class="card-top">
      <div class="badges"><span class="badge part" id="partBadge"></span><span class="badge category" id="categoryBadge"></span><span class="badge number" id="numberBadge" hidden></span></div>
      <div id="savedIndicator" class="saved-indicator"></div>
    </div>
    <div class="prompt">
      <div class="label">해석</div><div id="translation" class="translation"></div>
      <div class="answer-box"><div id="answerPlaceholder" class="answer-placeholder">정답 버튼을 눌러 확인하세요.</div><div id="answer" class="answer"></div></div>
    </div>
    <div class="actions"><button id="prevBtn" class="btn prev-btn">이전</button><button id="answerBtn" class="btn answer-btn">정답</button><button id="rememberBtn" class="btn remember-btn">☆ 기억하기</button><button id="nextBtn" class="btn next-btn">다음</button></div>
  </div>
  <div id="statusBox" class="status-box" style="display:none"><strong id="statusTitle"></strong><span id="statusText"></span><br><button id="statusNextBtn" class="mini-next" style="display:none">다음 문항 시작</button></div>
  <div class="tip">단축키: P/← 이전 · Space/Enter 정답 · N/→ 다음 · R 기억하기</div>
</section>
<section id="studyPanel" class="panel">
  <p class="study-intro">기존 카테고리와 관계없이, 시험에서 답변 방향을 크게 잡을 때 함께 떠올리기 좋은 문장들을 넓게 묶었습니다. 영어 문장 아래에는 원문 해석을 함께 표시합니다.</p>
  <div id="studyContent" class="study-content"></div>
</section>
<section id="savedPanel" class="panel">
  <div class="saved-head"><div><h2>기억한 문장</h2><p>저장한 문장을 한곳에서 확인할 수 있어요.</p></div><div class="saved-head-actions"><button id="backBtn" class="back-btn">← 문제로 돌아가기</button><button id="clearBtn" class="clear-btn">전체 삭제</button></div></div>
  <div id="savedList" class="saved-list"></div>
</section>
<div class="footer-note">기억하기 · 탭별 출제 진행도는 이 브라우저에 자동 저장됩니다.</div>
</div>
<script>

","translation":"화이트보드가 있다.","id":"m-p2-c08-014"},{"part":"2","category":"사물/배경","number":"015","sentence":"There is a street vendor.","translation":"노점상이 있다.","id":"m-p2-c08-015"},{"part":"2","category":"사물/배경","number":"016","sentence":"There is a streetlight.","translation":"가로등이 있다.","id":"m-p2-c08-016"},{"part":"2","category":"사물/배경","number":"017","sentence":"Items are arranged on the shelves.","translation":"물품들이 선반 위에 정리되어 있다.","id":"m-p2-c08-017"},{"part":"2","category":"마무리","number":"001","sentence":"Overall it seems like they're busy.","translation":"전반적으로 그들은 바쁜 것 같다.","id":"m-p2-c09-001"},{"part":"2","category":"마무리","number":"002","sentence":"Overall it seems like a busy day in a city.","translation":"전반적으로 도시의 분주한 날 같다.","id":"m-p2-c09-002"},{"part":"2","category":"마무리","number":"003","sentence":"Overall it seems like a beautiful sunny day.","translation":"전반적으로 아름다운 화창한 날씨인 것 같다.","id":"m-p2-c09-003"},{"part":"2","category":"마무리","number":"004","sentence":"Overall it seems like a peaceful day.","translation":"전반적으로 평화로운 날 같다.","id":"m-p2-c09-004"},{"part":"3","category":"비교하기","number":"001","sentence":"It relieves my stress. I'm stressed out these days. So, I need it.","translation":"그것은 저의 스트레스를 풀어줘요. 저는 요즘 스트레스를 많이 받아요. 그래서 그것이 필요해요.","id":"m-p3-c01-001"},{"part":"3","category":"비교하기","number":"002","sentence":"It's cheaper, so I can save money.","translation":"그것이 더 저렴해서 저는 돈을 절약할 수 있어요.","id":"m-p3-c01-002"},{"part":"3","category":"비교하기","number":"003","sentence":"The price is reasonable.","translation":"가격이 합리적이에요.","id":"m-p3-c01-003"},{"part":"3","category":"비교하기","number":"004","sentence":"It's faster, so I can save time.","translation":"그것은 더 빨라서 나는 시간을 절약할 수 있어요.","id":"m-p3-c01-004"},{"part":"3","category":"정보 얻기","number":"001","sentence":"I can get a lot of useful information from my friends.","translation":"저는 친구들에게서 많은 유용한 정보를 얻을 수 있어요.","id":"m-p3-c02-001"},{"part":"3","category":"정보 얻기","number":"002","sentence":"It's more reliable, so the information is more trustworthy.","translation":"그것은 더 믿을 만해서 정보가 더 신뢰가 가요.","id":"m-p3-c02-002"},{"part":"3","category":"정보 얻기","number":"003","sentence":"I can get information anytime anywhere on my smartphone.","translation":"언제 어디서나 정보를 내 스마트폰에서 얻을 수 있어요.","id":"m-p3-c02-003"},{"part":"3","category":"정보 얻기","number":"004","sentence":"I can get a lot of useful information from books.","translation":"나는 책에서 많은 유용한 정보를 얻을 수 있다.","id":"m-p3-c02-004"},{"part":"3","category":"정보 얻기","number":"005","sentence":"I can get a lot of useful information on the internet.","translation":"나는 인터넷에서 많은 유용한 정보를 얻을 수 있다.","id":"m-p3-c02-005"},{"part":"3","category":"좋은 시설과 핫플레이스","number":"001","sentence":"It has great facilities.","translation":"그것은 좋은 시설들을 가지고 있어요.","id":"m-p3-c03-001"},{"part":"3","category":"좋은 시설과 핫플레이스","number":"002","sentence":"It's a well-liked place, so people love it.","translation":"그곳은 인기 있는 곳이라, 사람들이 아주 좋아해요.","id":"m-p3-c03-002"},{"part":"3","category":"좋은 시설과 핫플레이스","number":"003","sentence":"They are too old, so I think it's good to have new ones.","translation":"그것들은 너무 오래 되어서 새로운 것이 생기면 좋을 것 같아요.","id":"m-p3-c03-003"},{"part":"3","category":"좋은 시설과 핫플레이스","number":"004","sentence":"If we had more stores here, it would be more convenient.","translation":"여기에 더 많은 가게들이 있다면, 더 편리할 거예요.","id":"m-p3-c03-004"},{"part":"3","category":"예산 부족","number":"001","sentence":"I'm a student, so my budget is tight.","translation":"저는 학생이라 예산이 빠듯해요.","id":"m-p3-c04-001"},{"part":"3","category":"예산 부족","number":"002","sentence":"I can't afford to buy expensive things.","translation":"저는 비싼 것을 살 여유가 없어요.","id":"m-p3-c04-002"},{"part":"3","category":"예산 부족","number":"003","sentence":"I don't want to waste too much money on that.","translation":"저는 그것에 돈을 너무 많이 낭비하고 싶지 않아요.","id":"m-p3-c04-003"},{"part":"3","category":"예산 부족","number":"004","sentence":"It's a waste of money.","translation":"그건 돈 낭비예요.","id":"m-p3-c04-004"},{"part":"3","category":"시간 부족","number":"001","sentence":"I'm a student, so I'm busy with (my) schoolwork.","translation":"저는 학생이어서 학업에 바빠요.","id":"m-p3-c05-001"},{"part":"3","category":"시간 부족","number":"002","sentence":"I don't have much time.","translation":"저는 시간이 별로 없어요.","id":"m-p3-c05-002"},{"part":"3","category":"시간 부족","number":"003","sentence":"I don't want to waste time on that.","translation":"저는 그것에 시간을 낭비하고 싶지 않아요.","id":"m-p3-c05-003"},{"part":"3","category":"시간 부족","number":"004","sentence":"It's a waste of time.","translation":"그것은 시간 낭비예요.","id":"m-p3-c05-004"},{"part":"3","category":"필요한 것","number":"001","sentence":"It's necessary for me.","translation":"그것은 저한테 꼭 필요해요.","id":"m-p3-c06-001"},{"part":"3","category":"필요한 것","number":"002","sentence":"I frequently use it.","translation":"저는 그것을 자주 이용해요.","id":"m-p3-c06-002"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"001","sentence":"It makes me happy and I can have a great experience.","translation":"그것은 저를 행복하게 해주고, 좋은 경험을 할 수 있게 해줘요.","id":"m-p3-c07-001"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"002","sentence":"They provide a good environment and a pleasant experience.","translation":"그들은 좋은 환경과 즐거운 경험을 제공해요.","id":"m-p3-c07-002"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"003","sentence":"I like to try new things.","translation":"저는 새로운 것들을 도전해 보는 것을 좋아해요.","id":"m-p3-c07-003"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"004","sentence":"It's reliable, so I can trust the product.","translation":"그것은 믿을 만해서 저는 그 제품을 신뢰할 수 있어요.","id":"m-p3-c07-004"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"005","sentence":"It's a popular item, so people will love it.","translation":"그것은 인기 있는 것이라 사람들이 좋아할 거예요.","id":"m-p3-c07-005"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"006","sentence":"It has sentimental value.","translation":"그것은 정서적인 가치가 담겨 있어요.","id":"m-p3-c07-006"},{"part":"3","category":"좋은 경험, 믿을 수 있는 선택","number":"007","sentence":"It's a good gift.","translation":"그것은 좋은 선물이에요.","id":"m-p3-c07-007"},{"part":"3","category":"일상과 감정 표현","number":"001","sentence":"It's part of my routine.","translation":"그것은 제 일상의 일부예요.","id":"m-p3-c08-001"},{"part":"3","category":"일상과 감정 표현","number":"002","sentence":"It's my habit.","translation":"그것은 제 습관이에요.","id":"m-p3-c08-002"},{"part":"3","category":"일상과 감정 표현","number":"003","sentence":"I really liked it!","translation":"저는 그것이 정말 좋았어요!","id":"m-p3-c08-003"},{"part":"3","category":"일상과 감정 표현","number":"004","sentence":"It was great!","translation":"그것은 훌륭했어요!","id":"m-p3-c08-004"},{"part":"3","category":"일상과 감정 표현","number":"005","sentence":"It was awesome!","translation":"그것은 근사했어요!","id":"m-p3-c08-005"},{"part":"3","category":"선택의 이유","number":"001","sentence":"It's cheaper and faster.","translation":"그것은 더 싸고 더 빨라요.","id":"m-p3-c09-001"},{"part":"3","category":"선택의 이유","number":"002","sentence":"It's very convenient and useful.","translation":"그것은 매우 편리하고 유용해요.","id":"m-p3-c09-002"},{"part":"3","category":"선택의 이유","number":"003","sentence":"It's very helpful to me.","translation":"그것은 저에게 매우 도움이 돼요.","id":"m-p3-c09-003"},{"part":"3","category":"선택의 이유","number":"004","sentence":"It's my favorite thing to do.","translation":"그것은 제가 가장 좋아하는 일이에요.","id":"m-p3-c09-004"},{"part":"3","category":"선택의 이유","number":"005","sentence":"It makes me happy, so I can forget about my worries.","translation":"그것은 저를 행복하게 해줘서, 저는 걱정을 잊을 수 있어요.","id":"m-p3-c09-005"},{"part":"3","category":"혼자 vs 같이","number":"001","sentence":"It's more fun and entertaining, so I don't get bored.","translation":"그것은 더 재미있고 즐거움을 줘서 저는 지루해지지 않아요.","id":"m-p3-c10-001"},{"part":"3","category":"혼자 vs 같이","number":"002","sentence":"I think it's more fun to do things in a group.","translation":"저는 여럿이 함께 하는 것이 더 재미있다고 생각해요.","id":"m-p3-c10-002"},{"part":"3","category":"혼자 vs 같이","number":"003","sentence":"I can meet new people and make friends.","translation":"저는 새로운 사람들을 만날 수 있고 친구들을 사귈 수 있어요.","id":"m-p3-c10-003"},{"part":"3","category":"혼자 vs 같이","number":"004","sentence":"I feel more comfortable and I can focus better.","translation":"저는 더 편안함을 느끼고 더 잘 집중할 수 있어요.","id":"m-p3-c10-004"},{"part":"3","category":"혼자 vs 같이","number":"005","sentence":"I don't have to waste time waiting for others.","translation":"저는 다른 사람들을 기다리느라 시간을 낭비할 필요가 없어요.","id":"m-p3-c10-005"},{"part":"3","category":"혼자 vs 같이","number":"006","sentence":"I feel more comfortable at home.","translation":"저는 집에서 더 편안함을 느껴요.","id":"m-p3-c10-006"},{"part":"3","category":"혼자 vs 같이","number":"007","sentence":"I can save time because I don't have to waste time going out.","translation":"외출하느라 시간을 낭비할 필요가 없기 때문에 저는 시간을 절약할 수 있어요.","id":"m-p3-c10-007"},{"part":"3","category":"소통의 방식","number":"001","sentence":"It's more personal and builds a closer relationship.","translation":"그것은 더 개인적이고 더 밀접한 관계를 쌓을 수 있어요.","id":"m-p3-c11-001"},{"part":"3","category":"소통의 방식","number":"002","sentence":"It causes less misunderstanding.","translation":"그것은 오해를 덜 불러일으켜요.","id":"m-p3-c11-002"},{"part":"4","category":"일정표","number":"001","sentence":"The conference will be held on June 20th at Hilton Hotel.","translation":"회의가 6월 20일에 힐튼 호텔에서 개최될 예정이예요.","id":"m-p4-c01-001"},{"part":"4","category":"일정표","number":"002","sentence":"The meeting will start at 9:00 a.m.","translation":"미팅은 오전 9시에 시작할 거예요.","id":"m-p4-c01-002"},{"part":"4","category":"일정표","number":"003","sentence":"The seminar will finish at 5:00 p.m.","translation":"세미나는 오후 5시에 끝날 거예요.","id":"m-p4-c01-003"},{"part":"4","category":"일정표","number":"004","sentence":"No, I'm afraid that you have the wrong information. Actually, the registration and coffee session will start at 9:00 a.m.","translation":"아니요, 유감스럽지만 잘못 알고 계십니다. 사실은, 등록 및 커피 타임은 오전 9시에 시작할 거예요.","id":"m-p4-c01-004"},{"part":"4","category":"일정표","number":"005","sentence":"There are two sessions. First, at 1 p.m., there is a workshop on social media marketing by Ray Kingston. Next, at 2:30 p.m., there is a discussion on appealing to sports fans through marketing by Kevin Delmont.","translation":"두 개의 세션이 있습니다. 먼저 오후 1시에는 레이 킹스턴의 소셜 미디어 마케팅에 관한 워크숍이 있습니다. 다음으로는 오후 2시 30분에 마케팅을 통해 스포츠 팬들에게 어필하는 것에 대한 케빈 델몬트의 토론이 있습니다.","id":"m-p4-c01-005"},{"part":"4","category":"개인 일정표","number":"001","sentence":"You will depart from San Francisco at 10 a.m.","translation":"당신은 오전 10시에 샌프란시스코에서 출발할 거예요.","id":"m-p4-c02-001"},{"part":"4","category":"개인 일정표","number":"002","sentence":"You will arrive in Los Angeles at 3 p.m.","translation":"당신은 오후 3시에 로스앤젤레스에 도착할 거예요.","id":"m-p4-c02-002"},{"part":"4","category":"개인 일정표","number":"003","sentence":"You will take Korean Air 105.","translation":"당신은 대한항공 105기를 탈 거예요.","id":"m-p4-c02-003"},{"part":"4","category":"개인 일정표","number":"004","sentence":"You will stay at Glen Hotel.","translation":"당신은 글렌 호텔에 머무를 거예요.","id":"m-p4-c02-004"},{"part":"4","category":"개인 일정표","number":"005","sentence":"You will have lunch/dinner/a meeting.","translation":"당신은 점심식사/저녁식사/회의를 할 거예요.","id":"m-p4-c02-005"},{"part":"4","category":"개인 일정표","number":"006","sentence":"You will give a speech/a presentation/a lecture.","translation":"당신은 연설/프레젠테이션/강의를 할 거예요.","id":"m-p4-c02-006"},{"part":"4","category":"개인 일정표","number":"007","sentence":"There was supposed to be an interview but it has been canceled.","translation":"인터뷰가 예정되어 있었으나 최소되었어요.","id":"m-p4-c02-007"},{"part":"4","category":"개인 일정표","number":"008","sentence":"There was supposed to be a meeting but it has been postponed.","translation":"미팅이 예정되어 있었으나 연기되었어요.","id":"m-p4-c02-008"},{"part":"4","category":"개인 일정표","number":"009","sentence":"There was supposed to be a meeting with Jane White at 2 p.m. on Tuesday, but it has been rescheduled to Friday.","translation":"화요일 오후 2시에 제인 화이트 씨와의 미팅이 예정되어 있었으나 금요일로 조정되었어요.","id":"m-p4-c02-009"},{"part":"4","category":"개인 일정표","number":"010","sentence":"You will depart from San Francisco at 10 a.m. on American Air 105.","translation":"당신은 10시에 아메리칸에어 105기를 타고 샌프란시스코에서 출발할 것입니다.","id":"m-p4-c02-010"},{"part":"4","category":"개인 일정표","number":"011","sentence":"There was supposed to be a meeting but it has been canceled.","translation":"회의가 있기로 되어 있었으나 취소되었다.","id":"m-p4-c02-011"},{"part":"4","category":"이력서","number":"001","sentence":"She got a master's degree in Design from Vancouver Art University in 2010.","translation":"그녀는 2010년에 밴쿠버 예술 대학교에서 디자인 전공으로 석사 학위를 취득했어요.","id":"m-p4-c03-001"},{"part":"4","category":"이력서","number":"002","sentence":"From 2015 to 2017, she worked at Jasper Fashion Magazine as a director.","translation":"2015년부터 2017년까지, 그녀는 재스퍼 패션 잡지사에서 이사로 일했어요.","id":"m-p4-c03-002"},{"part":"4","category":"이력서","number":"003","sentence":"From 2017 up to now, she has worked at Toronto Fashion Magazine as a chief editor.","translation":"2017년부터 지금까지, 그녀는 토론토 패션 잡지사에서 편집장으로 일해오고 있어요.","id":"m-p4-c03-003"},{"part":"4","category":"이력서","number":"004","sentence":"I think she is qualified because~.","translation":"저는 그녀가 자격을 갖췄다고 생각해요. 왜냐하면 ~.","id":"m-p4-c03-004"},{"part":"4","category":"이력서","number":"005","sentence":"He is fluent in Spanish.","translation":"그는 스페인어를 유창하게 구사해요.","id":"m-p4-c03-005"},{"part":"4","category":"이력서","number":"006","sentence":"She is certified in Pilates.","translation":"그녀는 필라테스 자격증이 있어요.","id":"m-p4-c03-006"},{"part":"4","category":"이력서","number":"007","sentence":"He has experience in education.","translation":"그는 교육 분야에 경험이 있어요.","id":"m-p4-c03-007"},{"part":"4","category":"이력서","number":"008","sentence":"She has a certificate.","translation":"그녀는 자격증이 있습니다.","id":"m-p4-c03-008"},{"part":"4","category":"면접 일정표","number":"001","sentence":"You will interview Jessica Anderson at 9:00 a.m.","translation":"당신은 제시카 앤더슨과 오전 9시에 면접을 볼 거예요.","id":"m-p4-c04-001"},{"part":"4","category":"면접 일정표","number":"002","sentence":"There is an interview with John White from Eco Electronics who is applying for the marketing director position.","translation":"마케팅 부장직에 지원하는 에코전자의 존 화이트 씨와 면접이 있어요.","id":"m-p4-c04-002"},{"part":"4","category":"면접 일정표","number":"003","sentence":"She has 5 years of experience.","translation":"그녀는 5년의 경력이 있어요.","id":"m-p4-c04-003"},{"part":"4","category":"면접 일정표","number":"004","sentence":"He is applying for the editor position.","translation":"그는 편집자 직책에 지원하고 있어요.","id":"m-p4-c04-004"},{"part":"4","category":"수업 시간표","number":"001","sentence":"You have to pay 20 dollars for the oil painting class.","translation":"오일 페인팅 수업으로 20달러를 지불하셔야 해요.","id":"m-p4-c05-001"},{"part":"4","category":"수업 시간표","number":"002","sentence":"It's 20 dollars.","translation":"그것은 20달러예요.","id":"m-p4-c05-002"},{"part":"4","category":"수업 시간표","number":"003","sentence":"You should register by January 3rd.","translation":"1월 3일까지 등록하셔야 해요.","id":"m-p4-c05-003"},{"part":"4","category":"수업 시간표","number":"004","sentence":"If you are a member, it's 20 dollars.","translation":"당신이 회원이라면, 20달러예요.","id":"m-p4-c05-004"},{"part":"4","category":"수업 시간표","number":"005","sentence":"It's free.","translation":"그것은 무료예요.","id":"m-p4-c05-005"},{"part":"4","category":"수업 시간표","number":"006","sentence":"It's for members.","translation":"그것은 회원들을 위한 것이에요.","id":"m-p4-c05-006"},{"part":"4","category":"수업 시간표","number":"007","sentence":"There is a Cooking for Beginners class.","translation":"'초보자를 위한 요리' 수업이 있어요.","id":"m-p4-c05-007"},{"part":"4","category":"수업 시간표","number":"008","sentence":"Sean Kim will teach the Painting class.","translation":"션 킴 강사가 '회화' 수업을 지도할 거예요.","id":"m-p4-c05-008"},{"part":"4","category":"수업 시간표","number":"009","sentence":"There is a class on French art history.","translation":"프랑스 예술사에 관한 수업이 있어요.","id":"m-p4-c05-009"},{"part":"4","category":"수업 시간표","number":"010","sentence":"Jennifer Huston will teach a class on computer skills.","translation":"제니퍼 휴스턴 강사가 컴퓨터 기술에 관한 수업을 지도할 예정이에요.","id":"m-p4-c05-010"},{"part":"4","category":"수업 시간표","number":"011","sentence":"If you are a member, it's free. If you are not a member, it's $20.","translation":"당신이 회원이라면 무료이지만 비회원이라면 20달러를 지불하셔야 합니다.","id":"m-p4-c05-011"},{"part":"4","category":"수업 시간표","number":"012","sentence":"It's for beginners.","translation":"이것은 초급자들을 위한 강좌입니다.","id":"m-p4-c05-012"},{"part":"4","category":"수업 시간표","number":"013","sentence":"It's for intermediate students.","translation":"이것은 중급자들을 위한 강좌입니다.","id":"m-p4-c05-013"},{"part":"4","category":"수업 시간표","number":"014","sentence":"It's for advanced students.","translation":"이것은 고급자들을 위한 강좌입니다.","id":"m-p4-c05-014"},{"part":"4","category":"수업 시간표","number":"015","sentence":"There's a cooking class.","translation":"요리 수업이 있습니다.","id":"m-p4-c05-015"},{"part":"4","category":"수업 시간표","number":"016","sentence":"Sean Kim will teach the cooking class.","translation":"션 킴 강사가 요리 수업을 지도할 것입니다.","id":"m-p4-c05-016"},{"part":"4","category":"수업 시간표","number":"017","sentence":"Jennifer Houston will teach a class on French art history.","translation":"제니퍼 휴스턴 강사가 프랑스 예술사에 관한 수업을 지도할 예정입니다.","id":"m-p4-c05-017"},{"part":"5","category":"다양한 경험","number":"001","sentence":"They can learn new things.","translation":"그들은 새로운 것들을 배울 수 있어요.","id":"m-p5-c01-001"},{"part":"5","category":"다양한 경험","number":"002","sentence":"They can meet new people and expand their network.","translation":"그들은 새로운 사람들을 만나고 인맥을 넓힐 수 있어요.","id":"m-p5-c01-002"},{"part":"5","category":"다양한 경험","number":"003","sentence":"They can have a lot of new experiences and broaden their perspective.","translation":"그들은 많은 것을 경험하고 그들의 견문을 넓힐 수 있어요.","id":"m-p5-c01-003"},{"part":"5","category":"다양한 경험","number":"004","sentence":"They can't make good decisions because they are not mature enough.","translation":"그들은 올바른 결정을 하지 못하는데 왜냐하면 그들은 아직 충분히 성숙하지 않기 때문이에요.","id":"m-p5-c01-004"},{"part":"5","category":"집중","number":"001","sentence":"They will be distracted.","translation":"그들은 집중력이 분산될 거예요.","id":"m-p5-c02-001"},{"part":"5","category":"집중","number":"002","sentence":"They can't focus on their studies/work.","translation":"그들은 공부/일에 집중할 수가 없어요.","id":"m-p5-c02-002"},{"part":"5","category":"집중","number":"003","sentence":"They can't get good grades at school.","translation":"그들은 학교에서 좋은 성적을 받을 수 없어요.","id":"m-p5-c02-003"},{"part":"5","category":"집중","number":"004","sentence":"They will fall behind in class.","translation":"그들은 학급에서 뒤처질 거예요.","id":"m-p5-c02-004"},{"part":"5","category":"집중","number":"005","sentence":"They can't work efficiently.","translation":"그들은 효율적으로 일할 수 없어요.","id":"m-p5-c02-005"},{"part":"5","category":"돈","number":"001","sentence":"They can save money.","translation":"그들은 돈을 절약할 수 있어요.","id":"m-p5-c03-001"},{"part":"5","category":"돈","number":"002","sentence":"The cost of living is too high.","translation":"생활비가 너무 비싸요.","id":"m-p5-c03-002"},{"part":"5","category":"돈","number":"003","sentence":"They can't make a living.","translation":"그들은 생계를 유지할 수 없어요.","id":"m-p5-c03-003"},{"part":"5","category":"돈","number":"004","sentence":"I can get a high(er) salary.","translation":"저는 (더) 높은 급여를 받을 수 있어요.","id":"m-p5-c03-004"},{"part":"5","category":"돈","number":"005","sentence":"That's a good investment because it makes lives better.","translation":"그것은 삶을 더 낫게 만들어주기 때문에 좋은 투자예요.","id":"m-p5-c03-005"},{"part":"5","category":"돈","number":"006","sentence":"The cost of (noun) is too expensive.","translation":"(명사)의 가격이 너무 비싸다.","id":"m-p5-c03-006"},{"part":"5","category":"돈","number":"007","sentence":"It's a waste of money.","translation":"이것은 돈 낭비다.","id":"m-p5-c03-007"},{"part":"5","category":"혼자 vs 같이","number":"001","sentence":"They can focus better.","translation":"그들은 더 잘 집중할 수 있어요.","id":"m-p5-c04-001"},{"part":"5","category":"혼자 vs 같이","number":"002","sentence":"They will not be distracted by others.","translation":"그들은 다른 사람들 때문에 방해받지 않을 거예요.","id":"m-p5-c04-002"},{"part":"5","category":"혼자 vs 같이","number":"003","sentence":"They can set their own schedule.","translation":"그들은 그들만의 일정을 짤 수 있어요.","id":"m-p5-c04-003"},{"part":"5","category":"혼자 vs 같이","number":"004","sentence":"They can have more freedom.","translation":"그들은 더 많은 자유를 가질 수 있어요.","id":"m-p5-c04-004"},{"part":"5","category":"혼자 vs 같이","number":"005","sentence":"They can get information and share it with other people.","translation":"그들은 정보를 얻고 그것을 다른 사람들과 공유할 수 있어요.","id":"m-p5-c04-005"},{"part":"5","category":"혼자 vs 같이","number":"006","sentence":"It feels more like a family.","translation":"그것은 더 가족처럼 느껴져요.","id":"m-p5-c04-006"},{"part":"5","category":"혼자 vs 같이","number":"007","sentence":"They feel more comfortable.","translation":"그들은 더 편안함을 느낀다.","id":"m-p5-c04-007"},{"part":"5","category":"혼자 vs 같이","number":"008","sentence":"It's fun and entertaining.","translation":"이것은 재밌고 즐거움을 준다.","id":"m-p5-c04-008"},{"part":"5","category":"기술","number":"001","sentence":"They can get a lot of useful information/latest information on the Internet.","translation":"그들은 인터넷상에서 많은 유용한 정보/최신 정보를 얻을 수 있어요.","id":"m-p5-c05-001"},{"part":"5","category":"기술","number":"002","sentence":"It's faster and more convenient.","translation":"그것은 더 빠르고 더 편리해요.","id":"m-p5-c05-002"},{"part":"5","category":"기술","number":"003","sentence":"There is a lot of inaccurate information on the Internet, so it's not reliable.","translation":"인터넷에는 많은 부정확한 정보가 있어서 믿을 만하지가 않아요.","id":"m-p5-c05-003"},{"part":"5","category":"기술","number":"004","sentence":"It is very distracting for students so students can't focus on their studies/work.","translation":"그것은 학생들의 집중을 분산시켜서 학생들은 공부/일에 집중할 수 없어요.","id":"m-p5-c05-004"},{"part":"5","category":"기술","number":"005","sentence":"I can get responses right away.","translation":"저는 즉시 답변을 받을 수 있어요.","id":"m-p5-c05-005"},{"part":"5","category":"기술","number":"006","sentence":"I can understand the speaker's feeling more accurately.","translation":"저는 화자의 감정을 더 정확하게 이해할 수 있어요.","id":"m-p5-c05-006"},{"part":"5","category":"기술","number":"007","sentence":"They can (verb) anytime anywhere on their smartphones.","translation":"그들은 언제 어디서나 그들의 스마트폰으로 (동사)할 수 있다.","id":"m-p5-c05-007"},{"part":"5","category":"기술","number":"008","sentence":"It's too expensive.","translation":"이것은 너무 지나치게 비싸다.","id":"m-p5-c05-008"},{"part":"5","category":"성격과 능력","number":"001","sentence":"They can create a friendly (work) atmosphere.","translation":"그들은 친근한 (업무) 분위기를 만들 수 있어요.","id":"m-p5-c06-001"},{"part":"5","category":"성격과 능력","number":"002","sentence":"They can communicate with others better.","translation":"그들은 다른 사람들과 더 잘 소통할 수 있어요.","id":"m-p5-c06-002"},{"part":"5","category":"성격과 능력","number":"003","sentence":"They can be good team players and make good relationships with others.","translation":"그들은 훌륭한 팀원이 될 수 있고, 다른 사람들과 좋은 관계를 맺을 수 있어요.","id":"m-p5-c06-003"},{"part":"5","category":"성격과 능력","number":"004","sentence":"They can have a good reputation.","translation":"그들은 좋은 평판을 받을 수 있어요.","id":"m-p5-c06-004"},{"part":"5","category":"성격과 능력","number":"005","sentence":"They can be very influential.","translation":"그들은 매우 영향력이 있을 수 있어요.","id":"m-p5-c06-005"},{"part":"5","category":"성격과 능력","number":"006","sentence":"They can motivate others.","translation":"그들은 다른 사람들을 동기 부여할 수 있어요.","id":"m-p5-c06-006"},{"part":"5","category":"성격과 능력","number":"007","sentence":"Everything is always changing and there is a lot of competition.","translation":"모든 것이 항상 변화하고 경쟁이 치열해요.","id":"m-p5-c06-007"},{"part":"5","category":"성격과 능력","number":"008","sentence":"They face a lot of challenges and difficulties.","translation":"그들은 많은 도전과 어려움에 직면해요.","id":"m-p5-c06-008"},{"part":"5","category":"성격과 능력","number":"009","sentence":"He is able to handle a variety of situations due to his confidence.","translation":"그는 그의 자신감 덕분에 다양한 상황을 처리할 수 있어요.","id":"m-p5-c06-009"},{"part":"5","category":"성격과 능력","number":"010","sentence":"They have a lot of experience/knowledge.","translation":"그들은 많은 경험/지식을 가지고 있어요.","id":"m-p5-c06-010"},{"part":"5","category":"성격과 능력","number":"011","sentence":"He is able to handle a variety of situations due to his creativity.","translation":"그는 그의 창의성 덕택에 다양한 상황을 잘 처리할 수 있다.","id":"m-p5-c06-011"},{"part":"5","category":"업무 환경과 기업 성공","number":"001","sentence":"Employees can work more efficiently and productively.","translation":"직원들은 더 효율적이고 더 생산적으로 일할 수 있어요.","id":"m-p5-c07-001"},{"part":"5","category":"업무 환경과 기업 성공","number":"002","sentence":"Employees can be more satisfied with their jobs.","translation":"직원들은 그들의 직업에 더 만족할 수 있어요.","id":"m-p5-c07-002"},{"part":"5","category":"업무 환경과 기업 성공","number":"003","sentence":"It can make a better work environment.","translation":"그것은 더 나은 업무 환경을 만들 수 있어요.","id":"m-p5-c07-003"},{"part":"5","category":"업무 환경과 기업 성공","number":"004","sentence":"They might appear less professional.","translation":"그들은 덜 전문적으로 보일 수 있어요.","id":"m-p5-c07-004"},{"part":"5","category":"업무 환경과 기업 성공","number":"005","sentence":"Customers will feel satisfied and remain loyal.","translation":"고객들은 만족감을 느낄 것이고 계속 충성할 거예요.","id":"m-p5-c07-005"},{"part":"5","category":"업무 환경과 기업 성공","number":"006","sentence":"It will attract more customers.","translation":"그것은 더 많은 고객을 유치할 거예요.","id":"m-p5-c07-006"},{"part":"5","category":"업무 환경과 기업 성공","number":"007","sentence":"The business will be more successful.","translation":"그 사업은 더 성공할 거예요.","id":"m-p5-c07-007"},{"part":"5","category":"업무 환경과 기업 성공","number":"008","sentence":"People frequently use social media, so it will be very effective.","translation":"사람들은 소셜 미디어를 자주 이용해서 그것은 매우 효과적일 거예요.","id":"m-p5-c07-008"},{"part":"5","category":"스트레스와 건강","number":"001","sentence":"It relieves their stress and they can relax.","translation":"그것은 그들의 스트레스를 풀어 주고, 그들은 편히 쉴 수 있어요.","id":"m-p5-c08-001"},{"part":"5","category":"스트레스와 건강","number":"002","sentence":"It is good for their (physical/mental) health.","translation":"그것은 그들의 (신체적/정신적) 건강에 좋아요.","id":"m-p5-c08-002"},{"part":"5","category":"스트레스와 건강","number":"003","sentence":"It is not good for their health.","translation":"그것은 그들의 건강에 좋지 않아요.","id":"m-p5-c08-003"},{"part":"5","category":"스트레스와 건강","number":"004","sentence":"It can develop healthy habits.","translation":"그것은 건강한 습관들을 기를 수 있어요.","id":"m-p5-c08-004"},{"part":"5","category":"스트레스와 건강","number":"005","sentence":"It can develop unhealthy habits.","translation":"그것은 건강하지 않은 습관들을 기를 수 있어요.","id":"m-p5-c08-005"},{"part":"5","category":"환경","number":"001","sentence":"It is good for the environment.","translation":"그것은 환경에 좋아요.","id":"m-p5-c09-001"},{"part":"5","category":"환경","number":"002","sentence":"Pollution is a serious issue these days.","translation":"환경오염은 요즘 심각한 문제예요.","id":"m-p5-c09-002"},{"part":"5","category":"환경","number":"003","sentence":"It can make a cleaner environment.","translation":"그것은 더 깨끗한 환경을 만들 수 있어요.","id":"m-p5-c09-003"},{"part":"5","category":"환경","number":"004","sentence":"We will be able to protect the environment.","translation":"우리는 환경을 보호할 수 있을 거예요.","id":"m-p5-c09-004"},{"part":"5","category":"과거 vs 현재","number":"001","sentence":"Most of all, people can find answers very quickly on the internet. So, they can save time and get the information right away. However, in the past, people had to go to the library and look through books. So, it took a long time to find what they were looking for.","translation":"무엇보다도, 사람들은 인터넷에서 아주 빠르게 답을 찾을 수 있어요. 그래서 시간을 절약할 수 있고, 정보를 바로 얻을 수 있어요. 하지만 예전에는 사람들이 도서관에 가서 책을 뒤져야 했어요. 그래서 원하는 걸 찾는 데 시간이 오래 걸렸어요.","id":"m-p5-c10-001"},{"part":"5","category":"과거 vs 현재","number":"002","sentence":"Previously, students had to go to a classroom to study.","translation":"예전에는 학생들이 공부를 하기 위해 교실에 가야만 했어요.","id":"m-p5-c10-002"},{"part":"5","category":"과거 vs 현재","number":"003","sentence":"But these days, they can study online without going anywhere.","translation":"하지만 요즘은 그들은 어디 가지 않아도 온라인으로 공부할 수 있어요.","id":"m-p5-c10-003"},{"part":"5","category":"과거 vs 현재","number":"004","sentence":"People used to wait for a taxi, but now they use mobile apps to call a taxi.","translation":"사람들이 예전에는 택시를 기다리곤 했지만, 지금은 택시를 부르기 위해 모바일 애플리케이션을 사용해요.","id":"m-p5-c10-004"},{"part":"5","category":"과거 vs 현재","number":"005","sentence":"Compared to the past, people can get infor function partData(part=selectedPart){return DATA.filter(x=>part==='all'||x.part===part)}

function getPool(){return DATA.filter(x=>(selectedPart==='all'||x.part===selectedPart)&&(selectedPart==='all'||selectedCategory==='all'||x.category===selectedCategory)&&(!rememberedOnly||remembered.has(x.id)))}
function filterKey(){return [selectedPart,selectedPart==='all'?'all':selectedCategory,rememberedOnly?'memory':'all'].join('|')}
function shuffled(ids){const a=[...ids];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sameMembers(a,b){if(a.length!==b.length)return false;const s=new Set(a);return b.every(x=>s.has(x))}
function ensureState(create=true){
  const key=filterKey(),ids=getPool().map(x=>x.id);let s=progress[key],changed=false;
  if(!s||!Array.isArray(s.order)||!sameMembers(s.order,ids)){
    if(!create)return null;

  }
  s.pos=Math.max(0,Math.min(Number(s.pos)||0,s.order.length));
  if(!Number.isInteger(s.cursor)){
    const idx=s.currentId?s.order.indexOf(s.currentId):-1;
    s.cursor=idx>=0?idx:(s.pos>0?Math.min(s.pos-1,s.order.length-1):-1);changed=true;
  }
  const maxCursor=Math.min(s.pos-1,s.order.length-1);
  const clamped=Math.max(-1,Math.min(s.cursor,maxCursor));
  if(clamped!==s.cursor){s.cursor=clamped;changed=true}
  if(s.currentId&&!ids.includes(s.currentId)){s.currentId=null;changed=true}
  if(s.currentId){
    const idx=s.order.indexOf(s.currentId);
    if(idx>=0&&idx<s.pos&&s.cursor!==idx){s.cursor=idx;changed=true}
  }
  if(changed){progress[key]=s;saveProgress()}

}

function renderCategoryTabs(){const row=$('categoryRow'),wrap=$('categoryButtons');if(selectedPart==='all'){row.style.display='none';selectedCategory='all';wrap.innerHTML='';return}row.style.display='flex';const cats=availableCategories();if(selectedCategory!=='all'&&!cats.includes(selectedCategory))selectedCategory='all';wrap.innerHTML='';['all',...cats].forEach(c=>{const b=document.createElement('button');b.className='filter-btn'+(c===selectedCategory?' active':'');b.textContent=c==='all'?'전체':c;b.onclick=()=>selectCategory(c);wrap.appendChild(b)})}
function updatePoolInfo(){const pool=getPool(),s=ensureState(),p=selectedPart==='all'?'전체':`Part ${selectedPart}`,c=selectedPart!=='all'&&selectedCategory!=='all'?` · ${selectedCategory}`:'',m=rememberedOnly?' · 기억한 문장만':'';$('poolInfo').innerHTML=`${p}${c}${m} · ${pool.length}문장 <span class="progress-chip">출제 <strong>${s?s.cursor+1:0}/${pool.length}</strong></span>`}
function renderFilters(){renderPartTabs();renderCategoryTabs();$('memoryOnly').checked=rememberedOnly;saveUI();updatePoolInfo()}
function showStatus(title,text,withNext=false){$('quizCard').style.display='none';$('statusBox').style.display='block';$('statusTitle').textContent=title;$('statusText').textContent=text;$('statusNextBtn').style.display=withNext?'inline-block':'none'}
function hideStatus(){$('quizCard').style.display='block';$('statusBox').style.display='none'}
function resetQuestionState(){revealed=false}
function restoreCurrentOrStart(){const pool=getPool();updatePoolInfo();if(!pool.length){currentId=null;showStatus('출제할 문장이 없습니다.',rememberedOnly?'현재 탭에서 기억한 문장이 없어요. ‘기억한 문장만 출제’를 해제하거나 다른 탭을 선택해 주세요.':'현재 탭에 문장이 없습니다.');return}const s=ensureState();if(s.paused){currentId=null;showStatus('한 회차를 모두 완료했습니다.',`진행도가 0/${pool.length}으로 초기화되었습니다. ‘다음 문항 시작’을 누르면 새 순서로 다시 출제됩니다.`,true);return}if(s.currentId&&byId.has(s.currentId)){currentId=s.currentId;resetQuestionState();hideStatus();renderQuestion();return}drawNext()}
function drawNext(){
  const pool=getPool();if(!pool.length){restoreCurrentOrStart();return}
  const s=ensureState();
  if(s.cursor<s.pos-1){
    s.cursor+=1;currentId=s.order[s.cursor];s.currentId=currentId;s.paused=false;progress[filterKey()]=s;saveProgress();resetQuestionState();hideStatus();updatePoolInfo();renderQuestion();return
  }
  if(s.pos>=s.order.length){
    s.order=shuffled(pool.map(x=>x.id));s.pos=0;s.cursor=-1;s.currentId=null;s.paused=true;progress[filterKey()]=s;saveProgress();currentId=null;resetQuestionState();updatePoolInfo();showStatus('한 회차를 모두 완료했습니다.',`진행도가 0/${pool.length}으로 초기화되었습니다. ‘다음 문항 시작’을 누르면 새 순서로 다시 출제됩니다.`,true);return
  }
  currentId=s.order[s.pos];s.pos+=1;s.cursor=s.pos-1;s.currentId=currentId;s.paused=false;progress[filterKey()]=s;saveProgress();resetQuestionState();hideStatus();updatePoolInfo();renderQuestion()
}
function canGoPrevious(){const s=ensureState(false);return !!(currentId&&s&&Number.isInteger(s.cursor)&&s.cursor>0)}
function goPrevious(){
  const s=ensureState(false);if(!currentId||!s||!Number.isInteger(s.cursor)||s.cursor<=0)return;
  s.cursor-=1;currentId=s.order[s.cursor];s.currentId=currentId;s.paused=false;progress[filterKey()]=s;saveProgress();resetQuestionState();hideStatus();updatePoolInfo();renderQuestion()
}
function shuffleCurrent(){const pool=getPool(),key=filterKey();progress[key]={order:shuffled(pool.map(x=>x.id)),pos:0,cursor:-1,currentId:null,paused:false};saveProgress();currentId=null;resetQuestionState();restoreCurrentOrStart()}
function renderQuestion(){const item=byId.get(currentId);if(!item)return;$('partBadge').textContent=`Part ${item.part}`;$('categoryBadge').textContent=item.category;$('numberBadge').textContent=`#${item.number}`;$('translation').textContent=item.translation;$('answer').textContent=item.sentence;$('answer').classList.toggle('show',revealed);$('answerPlaceholder').style.display=revealed?'none':'block';$('answerBtn').textContent=revealed?'정답 숨기기':'정답';$('prevBtn').disabled=!canGoPrevious();const saved=remembered.has(item.id);$('rememberBtn').classList.toggle('active',saved);$('rememberBtn').textContent=saved?'★ 기억됨':'☆ 기억하기';$('savedIndicator').textContent=saved?'★ 저장됨':''}
function toggleAnswer(){if(!currentId)return;revealed=!revealed;renderQuestion()}
function resetMemoryQueues(){Object.keys(progress).filter(k=>k.endsWith('|memory')).forEach(k=>delete progress[k]);saveProgress()}
function refreshRememberedViews(){saveRemembered();renderSaved();resetMemoryQueues();if(rememberedOnly)restoreCurrentOrStart();else{if(currentId)renderQuestion();updatePoolInfo()}}
function toggleRemember(id=currentId){if(!byId.has(id))return;if(remembered.has(id))remembered.delete(id);else remembered.add(id);refreshRememberedViews()}
function removeRemembered(id){remembered.delete(id);refreshRememberedViews()}
function updateStudyRememberButton(button){const saved=remembered.has(button.dataset.sentenceId);button.classList.toggle('active',saved);button.textContent=saved?'★ 기억됨':'☆ 기억하기';button.setAttribute('aria-pressed',String(saved))}
function updateStudyRememberButtons(){document.querySelectorAll('.study-remember-btn').forEach(updateStudyRememberButton)}
function renderSaved(){updateSavedCount();const items=DATA.filter(x=>remembered.has(x.id));const list=$('savedList');list.innerHTML='';if(!items.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>아직 기억한 문장이 없습니다.</strong><br><span style="font-size:13px;display:inline-block;margin-top:8px;">퀴즈 모드 또는 암기 모드에서 ‘기억하기’를 눌러 추가하세요.</span>';list.appendChild(e);return}items.forEach(item=>{const card=document.createElement('article');card.className='saved-card';const meta=document.createElement('div');meta.className='saved-meta';const cat=document.createElement('div');cat.className='saved-category';cat.textContent=`Part ${item.part} · ${item.category} · #${item.number}`;const stats=document.createElement('div');stats.className='saved-stats';const rm=document.createElement('button');rm.className='remove-btn';rm.textContent='삭제';rm.onclick=()=>removeRemembered(item.id);stats.append(rm);meta.append(cat,stats);const ko=document.createElement('div');ko.className='saved-ko';ko.textContent=item.translation;const en=document.createElement('div');en.className='saved-en';en.textContent=item.sentence;card.append(meta,ko,en);list.appendChild(card)})}
function selectPart(part){selectedPart=part;selectedCategory='all';renderFilters();restoreCurrentOrStart()}
function selectCategory(cat){selectedCategory=cat;renderFilters();restoreCurrentOrStart()}
function studyEntries(){return STUDY_GROUP_INDEX.filter(x=>studyPart==='all'||x.studyPart===studyPart)}
function studyMetaParts(){return studyPart==='all'?['2','4','35']:[studyPart]}
function studyPartTitle(p){return p==='35'?'Part 3, 5':`Part ${p}`}
function renderStudyContent(){
  const target=$('studyContent');target.innerHTML='';
  const entries=studyEntries();
  if(!entries.length){target.innerHTML='<div class="study-empty">표시할 문장이 없습니다.</div>';return}
  studyMetaParts().forEach(sp=>{
    const partEntries=entries.filter(e=>e.studyPart===sp);
    if(!partEntries.length)return;
    const partSection=document.createElement('section');partSection.className='study-part-section';
    if(studyPart==='all'){
      const partHead=document.createElement('div');partHead.className='study-part-heading';
      const h=document.createElement('h2');h.textContent=studyPartTitle(sp);
      const c=document.createElement('span');c.textContent=`${partEntries.length}문장`;
      partHead.append(h,c);partSection.appendChild(partHead);
    }
    (STUDY_GROUP_META[sp]||[]).forEach(meta=>{
      const groupEntries=partEntries.filter(e=>e.group===meta.name);
      if(!groupEntries.length)return;
      const card=document.createElement('article');card.className='study-category-card';
      const head=document.createElement('div');head.className='study-category-head';
      const titleWrap=document.createElement('div');titleWrap.className='study-title-wrap';
      const title=document.createElement('h2');title.textContent=meta.name;
      const desc=document.createElement('p');desc.className='study-group-desc';desc.textContent=meta.desc;
      titleWrap.append(title,desc);
      const metaBox=document.createElement('div');metaBox.className='study-category-meta';
      const partChip=document.createElement('span');partChip.className='study-part-chip';partChip.textContent=studyPartTitle(sp);
      const countChip=document.createElement('span');countChip.className='study-count-chip';countChip.textContent=`${groupEntries.length}문장`;
      metaBox.append(partChip,countChip);head.append(titleWrap,metaBox);card.appendChild(head);
      const ul=document.createElement('ul');ul.className='study-list broad-study-list';
      groupEntries.forEach(e=>{
        const item=byId.get(e.id);if(!item)return;
        const li=document.createElement('li');
        const en=document.createElement('div');en.className='study-en';en.textContent=item.sentence;
        const ko=document.createElement('div');ko.className='study-ko';ko.textContent=item.translation;
        const row=document.createElement('div');row.className='study-sentence-row';
        const text=document.createElement('div');text.className='study-sentence-text';text.append(en,ko);
        const remember=document.createElement('button');remember.type='button';remember.className='study-remember-btn';remember.dataset.sentenceId=item.id;
        remember.setAttribute('aria-label',item.sentence+' 기억하기');updateStudyRememberButton(remember);remember.onclick=()=>toggleRemember(item.id);
        row.append(text,remember);li.appendChild(row);ul.appendChild(li);
      });
      card.appendChild(ul);partSection.appendChild(card);
    });
    target.appendChild(partSection);
  });
}
function renderStudy(){renderPartTabs();renderStudyContent()}
function selectStudyPart(part){studyPart=part;saveStudyUI();renderStudy()}
function setMode(mode){if(!['memory','study'].includes(mode))return;appMode=mode;localStorage.setItem(MODE_KEY,mode);if(mode==='study')currentView='quiz';renderAppMode()}
function renderAppMode(){const memory=appMode==='memory';$('memoryModeBtn').classList.toggle('active',memory);$('studyModeBtn').classList.toggle('active',!memory);$('savedOpenBtn').style.display='inline-block';$('backBtn').textContent=memory?'← 퀴즈 모드로 돌아가기':'← 암기 모드로 돌아가기';$('quizPanel').classList.toggle('active',memory&&currentView==='quiz');$('savedPanel').classList.toggle('active',currentView==='saved');$('studyPanel').classList.toggle('active',!memory&&currentView==='quiz');$('partTabs').style.display=currentView==='saved'?'none':'flex';$('modeSubtitle').innerHTML=memory?`퀴즈 모드 · 해석을 보고 영어 문장을 떠올려 보세요. 총 <strong id="totalCountInline">${DATA.length}</strong>문장`:'암기 모드 · 답변 방향을 크게 잡을 때 함께 떠올릴 문장들을 묶어서 암기하세요.';if(memory){renderPartTabs();renderCategoryTabs();$('memoryOnly').checked=rememberedOnly;saveUI();updatePoolInfo();if(currentView==='saved'){renderSaved()}else if(currentId&&byId.has(currentId)){hideStatus();renderQuestion()}else{restoreCurrentOrStart()}}else{if(currentView==='saved')renderSaved();else renderStudy()}}
function switchView(view){currentView=view;renderAppMode()}
$('prevBtn').onclick=goPrevious;$('answerBtn').onclick=toggleAnswer;$('rememberBtn').onclick=()=>toggleRemember();$('nextBtn').onclick=drawNext;$('shuffleBtn').onclick=shuffleCurrent;$('statusNextBtn').onclick=drawNext;$('savedOpenBtn').onclick=()=>switchView('saved');$('backBtn').onclick=()=>switchView('quiz');
$('memoryOnly').onchange=()=>{rememberedOnly=$('memoryOnly').checked;saveUI();renderFilters();restoreCurrentOrStart()};
$('clearBtn').onclick=()=>{if(!remembered.size)return;if(confirm('기억한 문장을 모두 삭제할까요?')){remembered.clear();refreshRememberedViews()}};
document.addEventListener('keydown',e=>{if(appMode!=='memory'||currentView!=='quiz')return;if(e.target&&['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleAnswer()}if(e.key.toLowerCase()==='p'||e.key==='ArrowLeft')goPrevious();if(e.key.toLowerCase()==='n'||e.key==='ArrowRight')drawNext();if(e.key.toLowerCase()==='r')toggleRemember()});
$('memoryModeBtn').onclick=()=>setMode('memory');$('studyModeBtn').onclick=()=>setMode('study');$('totalCount').textContent=DATA.length;updateSavedCount();renderSaved();renderAppMode();
</script>
</body>
</html>
